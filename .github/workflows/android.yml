name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy web game into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GjurmetETempullit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GjurmetETempullit-apk
          path: GjurmetETempullit.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Gjurmët e Tempullit v1.2.${{ github.run_number }}
          body: APK gati për instalim në Android. Shkarko GjurmetETempullit.apk dhe hape në telefon.
          files: GjurmetETempullit.apk
